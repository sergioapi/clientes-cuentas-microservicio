spring:
  application:
    name: clientes-cuentas-microservicio

  datasource:
    url: ${DB_URL:jdbc:h2:mem:clientescuentas;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        query:
          fail_on_pagination_over_collection_fetch: true

  flyway:
    enabled: true

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:true}
      path: /h2-console

springdoc:
  enable-default-api-docs: false
  swagger-ui:
    url: /openapi.yaml
    disable-swagger-default-url: true
